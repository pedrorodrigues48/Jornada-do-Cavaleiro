name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-allegro
            mingw-w64-x86_64-pkgconf

      - name: Compilar (-Wall -Wextra -Werror)
        run: |
          mkdir -p build
          gcc -Wall -Wextra -Werror -std=gnu99 -Iinclude \
            $(pkg-config --cflags allegro-5 allegro_image-5 allegro_font-5 allegro_ttf-5 allegro_audio-5 allegro_acodec-5 allegro_primitives-5 allegro_dialog-5) \
            src/main.c src/cavaleiro.c src/inimigo.c src/jogo.c src/recursos.c \
            -o build/JornadaDoCavaleiro.exe \
            $(pkg-config --libs allegro_main-5 allegro-5 allegro_image-5 allegro_font-5 allegro_ttf-5 allegro_audio-5 allegro_acodec-5 allegro_primitives-5 allegro_dialog-5)

      - uses: actions/upload-artifact@v4
        with:
          name: JornadaDoCavaleiro-windows
          path: |
            build/JornadaDoCavaleiro.exe
            assets/
